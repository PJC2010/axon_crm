# PR gate — the hermetic suite only. Live vendor tests (-m live) are excluded
# here by construction and run in nightly-contract.yml instead; vendor API
# keys are never exposed to this workflow.
name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run hermetic test suite
        run: pytest tests/ -m "not live"
