# Render Blueprint for Axon CRM (backend API + managed Postgres).
#
# The Postgres database is the durable home for the HCAD data: Render's web
# filesystem is ephemeral, so the local DuckDB is NOT used in production. Load
# the county data into this database once with tools/load_hcad_to_postgres.py
# (see docs/RENDER_DEPLOYMENT.md), and the pipeline reads it via the Postgres
# fallback in pipeline/hcad_store.py.
#
# Deploy: push this file to your repo, then "New + > Blueprint" in Render.

databases:
  - name: axon-crm-db
    plan: starter            # NOT free — free Postgres expires ~30 days.
    databaseName: axon_crm
    user: axon_crm

services:
  - type: web
    name: axon-crm-api
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    # Runs after build, before the new version goes live, with env vars present.
    preDeployCommand: python db/migrate.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: axon-crm-db
          property: connectionString
      # NOTE: this was historically declared as JWT_SECRET, which the code never
      # reads (api/security.py reads JWT_SECRET_KEY) — prod worked only via a
      # dashboard-set JWT_SECRET_KEY. Before syncing this blueprint, confirm the
      # dashboard value exists; a freshly generated value here would rotate the
      # signing key and log every session out.
      - key: JWT_SECRET_KEY
        generateValue: true        # required; the app hard-fails if unset.
      # Application log level. INFO surfaces the per-step pipeline progress and
      # timing tables; without it uvicorn leaves root at WARNING and every
      # log.info() in api/ and pipeline/ is dropped. Set WARNING to quiet down.
      - key: LOG_LEVEL
        value: INFO
      # The nightly ML retrain (ml_retrain_nightly, ML_RETRAIN_HOUR:00 UTC) is
      # OFF by default in config.py and is deliberately NOT declared here: set
      # ML_RETRAIN_ENABLED=true in the Render dashboard when you want it, so a
      # blueprint sync can't quietly turn it back off. It runs inside this web
      # service, so re-enable it only with the ML_MAX_* caps in place — see
      # docs/DATA_PIPELINE.md.
      #
      # HCAD-first, paid sources off. The DuckDB never ships to Render, so leave
      # PERMIT_DB_PATH empty to force the durable Postgres mirror path.
      - key: SEED_SOURCE
        value: hcad
      # Sort memory for the shared-parcel-cache seed statements (SET LOCAL,
      # seed transactions only). SIZED AGAINST THE DATABASE PLAN's RAM, not
      # this web service's: 64 suits a 1GB Postgres; set 16-32 if the database
      # is still on the 256MB starter plan.
      - key: SEED_WORK_MEM_MB
        value: "64"
      - key: PERMIT_DB_PATH
        value: ""
      # Public links in emails (password reset, verification) and admin reset
      # URLs. This must be the deployed FRONTEND origin — it used to point at
      # this API's own onrender.com host, which sent reset links to the wrong
      # place. The admin security panel warns when it looks wrong.
      - key: APP_BASE_URL
        value: https://axonhtx.com
      # This API's own public origin — used to build the Twilio voice webhook
      # URLs configured on purchased call-tracking numbers (calls module).
      - key: PUBLIC_API_BASE_URL
        value: https://axon-crm.onrender.com
      # Paid APIs — left blank on purpose. Set RENTCAST_API_KEY later to test
      # RentCast as a gap-filler; the property step no-ops while it is empty.
      - key: RENTCAST_API_KEY
        value: ""
      - key: GOOGLE_GEOCODE_KEY
        value: ""
      # Transactional email (Resend) — powers signup verification, password
      # reset, and invoice/quote delivery. Set both in the dashboard:
      #   RESEND_API_KEY   — Resend API key
      #   RESEND_FROM_EMAIL — must be admin@axonhtx.com (domain verified in Resend)
      # If either is unset, email fails soft (signup still succeeds, no email sent).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Landing-page "see your ZIP's top leads, free" widget (api/routes/zip_sample.py).
      # Must be the account_id that owns the seeded sample leads in THIS (prod) DB —
      # verify with `SELECT id, name FROM accounts;`, do not assume it is 1.
      # Unset => endpoint returns {configured:false} and the widget shows nothing.
      - key: PUBLIC_SAMPLE_ACCOUNT_ID
        sync: false
      # Auto-seed a free HCAD run for an un-scored (Harris County) ZIP on demand,
      # rate-capped by PUBLIC_SAMPLE_RUNS_PER_HOUR.
      - key: PUBLIC_SAMPLE_AUTORUN
        value: "true"
      # Stripe — BOTH halves of the money flow. Subscription billing (accounts
      # paying for Axon) needs STRIPE_SECRET_KEY + the three STRIPE_PRICE_* ids
      # + STRIPE_BILLING_WEBHOOK_SECRET (a *platform* webhook endpoint pointed
      # at /api/public/stripe/billing-webhook). Checkout deliberately refuses to
      # open until the billing webhook secret is set — without it Stripe would
      # collect money the app never hears about. Connect invoice payments use
      # the separate STRIPE_WEBHOOK_SECRET (a *Connect* endpoint pointed at
      # /api/public/stripe/webhook). All fail soft while unset.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_BILLING_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      # Website lead intake (insure-auto). Generate a long random value, set it
      # here, and copy the same value into insure-auto's Vercel AXON_API_KEY env
      # var (Preview + Production). Find PUBLIC_INTAKE_ACCOUNT_ID via
      # `SELECT id FROM accounts;` for this agency's account.
      - key: PUBLIC_INTAKE_API_KEY
        sync: false
      - key: PUBLIC_INTAKE_ACCOUNT_ID
        sync: false
